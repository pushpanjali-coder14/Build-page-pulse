<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Pulse - Website Auditor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Page Pulse</h1>
    <p>Audit any website instantly</p>
    <input type="text" id="urlInput" placeholder="https://example.com">
    <button onclick="auditURL()">Audit</button>
    <div id="result"></div>
  </div>
  <footer>
    Built for <a href="https://digitalheroesco.com" target="_blank">Digital Heroes Training Task</a>
  </footer>
  <script>
    async function auditURL() {
      const url = document.getElementById('urlInput').value;
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = "Loading...";
      
      const res = await fetch('/api/audit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url})
      });
      const data = await res.json();
      
      if(data.error) {
        resultDiv.innerHTML = `<p class="error">${data.error}</p>`;
      } else {
        resultDiv.innerHTML = `
          <h3>Audit Report</h3>
          <p><b>Status:</b> ${data.http_status}</p>
          <p><b>Response Time:</b> ${data.response_time_ms} ms</p>
          <p><b>Title:</b> ${data.page_title}</p>
          <p><b>Meta Description:</b> ${data.meta_description}</p>
          <p><b>H1 Count:</b> ${data.h1_count}</p>
          <p><b>Images missing ALT:</b> ${data.images_missing_alt}</p>
          <p><b>Word Count:</b> ${data.approximate_word_count}</p>
        `;
      }
    }
  </script>
</body>
</html>
